# Builds the FHIR adapter image from source and parks it in ECR as a deploy
# candidate. Same contract as fits-webapp-hid: this workflow never writes the
# :latest tag the running service follows, so a push here cannot change what
# runs by itself. Promotion happens from Mission Control after a human
# approves the candidate.

name: build-image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # lets the job assume the AWS role via OIDC; no stored keys
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPO: 708499050170.dkr.ecr.us-east-2.amazonaws.com/healthit/fits-adapter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # All Maven traffic goes through our Nexus (anonymous read). fhirLib is
      # our own 1.0-SNAPSHOT there, so central is redefined with snapshots on.
      - name: maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <mirrors>
              <mirror>
                <id>nexus</id>
                <mirrorOf>*</mirrorOf>
                <url>https://nexus.valitheus.com/repository/public/</url>
              </mirror>
            </mirrors>
            <profiles>
              <profile>
                <id>nexus</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://nexus.valitheus.com/repository/public/</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>nexus</activeProfile>
            </activeProfiles>
          </settings>
          XML

      - name: cache maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      # Install ForecastConnector and FHIR LIB in 4 steps
      # Step 1: Install Java 8 (Temurin distribution)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven' # Speeds up subsequent workflow runs by caching dependencies

      # Step 2: Pull the external dependency repository at a specific commit hash
      - name: Pull VaccineForecastConnector Dependency
        uses: actions/checkout@v4
        with:
          repository: 'immregistries/VaccineForecastConnector'
          ref: 'ff8008bace76612429f2d07db0389959cb0c98c1'
          path: 'temp-dependency' # Clones it into a temporary subdirectory


      # Step 3: Run the Maven command to build and install it to the local cache
      - name: Build VaccineForecastConnector and Cache Dependency Locally
        run: |
          cd temp-dependency
          mvn clean install
          cd ..
          rm -rf temp-dependency # Optional: Cleans up the directory to keep your runner clean

      # Step 4 : Rerun for FHIR lib
      - name: Pull FhirLib Dependency
        uses: actions/checkout@v4
        with:
          repository: "https://github.com/usnistgov/fhirLib"
          ref: 'f619a839d46a8babdba5ccc0652cf6a1d35db209'
          path: 'temp-dependency-2' # Clones it into a temporary subdirectory
      # Step 5: Run the Maven command for FHIR lib to build and install it to the local cache
      - name: Build FhirLib and Cache Dependency Locally
        run: |
          cd temp-dependency
          mvn clean install
          cd ..
          rm -rf temp-dependency # Optional: Cleans up the directory to keep your runner clean

      # Step 4: Run your main project's Maven build or build your docker image

      # The pom targets Java 7 bytecode and the image runs on a JDK 8 Tomcat,
      # so build with 8.
      - name: build war
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -v "$HOME/.m2/repository:/root/.m2/repository" \
            -v "$HOME/.m2/settings.xml:/root/.m2/settings.xml:ro" \
            -w /src maven:3.9-eclipse-temurin-8 \
            mvn -B -DskipTests clean package
          sudo chown -R "$(id -u):$(id -g)" target
          test -f target/fhirAdapter.war

